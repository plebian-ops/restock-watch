name: Stock check

# Runs by itself: once an hour in November, then every 15 minutes from December 1, 12:00 AM Manila time, and ongoing.
# GitHub's clock is UTC, 8 hours behind Manila, so December 1 12:00 AM Manila is November 30 16:00 here.
# The minutes are kept off :00, :15, :30 and :45, GitHub's busiest.
# It can also be started by hand from the Actions tab. To pause it: Actions > Stock check > ... > Disable workflow.
# The November lines repeat every year. To keep 15 minutes through a later November, replace all four lines
# with one: '8,23,38,53 * * * *'.
on:
  schedule:
    - cron: '23 * 1-29 11 *'              # November 1 to 29: once an hour
    - cron: '23 0-15 30 11 *'             # November 30 until 11:23 PM Manila: once an hour
    - cron: '8,23,38,53 16-23 30 11 *'    # from December 1, 12:00 AM Manila: every 15 minutes
    - cron: '8,23,38,53 * * 1-10,12 *'    # December onwards: every 15 minutes
  workflow_dispatch:
    inputs:
      test_alert:
        description: Also send a test alert to the phone
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Crawl the links
        uses: ./.github/actions/crawl

      - name: Read the pages and compare with the last check
        id: read
        run: node check.js out /tmp/captured

      - name: Save the new reading
        if: always() && steps.read.outputs.save == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last.json
          git commit -q -m "Reading changed" || exit 0
          git push -q || { git fetch -q origin main && git reset -q --hard origin/main; }

      - name: Alert on the phone
        if: always() && (steps.read.outputs.alert == 'true' || inputs.test_alert)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_TEXT: ${{ secrets.TELEGRAM_TEST_TEXT }}
        run: node send-alert.js ${{ inputs.test_alert && '--test' || '' }}

      - name: Alert
        if: always() && steps.read.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "
          const fs=require('fs');const {execFileSync}=require('child_process');
          for(const a of JSON.parse(fs.readFileSync('alerts.json','utf8'))){
            fs.writeFileSync('alert-body.md',a.body);
            execFileSync('gh',['issue','create','--title',a.title,'--body-file','alert-body.md','--assignee','${{ github.repository_owner }}'],{stdio:'inherit'});
          }"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-output
          path: |
            out
            /tmp/captured
          retention-days: 3
